<!DOCTYPE html>
<html>
<head>
  <title>Rewa Grocery Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; margin:0; background:#f5f5f5; }

    header {
      background:#2ecc71;
      color:white;
      padding:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:20px;
    }

    .search-box {
      padding:6px;
      border:none;
      border-radius:5px;
      width:150px;
    }

    .container {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:15px;
      padding:20px;
    }

    .card {
      background:white;
      padding:15px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .card img {
      width:100%;
      height:120px;
      object-fit:cover;
      border-radius:8px;
    }

    .price { color:#2ecc71; font-weight:bold; }

    button {
      padding:8px;
      margin:5px;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }

    .add { background:#25D366; color:white; }
    .pay { background:#6c5ce7; color:white; }

    .qty {
      display:flex;
      justify-content:center;
      gap:5px;
    }

    .cart-box {
      position: fixed;
      right: 10px;
      bottom: 10px;
      width: 280px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    input {
      width:100%;
      padding:8px;
      margin-top:5px;
    }
  </style>
</head>

<body>

<header>
  🛒 Rewa Grocery Store
  <input type="text" class="search-box" placeholder="Search..." onkeyup="searchProduct(this.value)">
</header>

<div class="container" id="products"></div>

<div class="cart-box">
  <h3>🛒 Cart</h3>
  <div id="cartItems"></div>

  <p>Items: ₹<span id="itemsTotal">0</span></p>
  <p>Delivery: ₹<span id="delivery">20</span></p>
  <p><b>Total: ₹<span id="grandTotal">0</span></b></p>

  <input type="text" id="address" placeholder="Enter address">

  <button class="pay" onclick="goToPayment()">Pay via UPI</button>
  <button class="add" onclick="placeOrder()">Place Order via WhatsApp</button>
</div>

<script>
window.onload = function() {

const whatsappNumber = "918109788338";

let cart = [];

const products = [
  { name:"Rice (1kg)", price:70, img:"https://c.ndtvimg.com/2023-08/brlp7gk_uncooked-rice-or-rice-grains_625x300_18_August_23.jpg?im=FaceCrop,algorithm=dnn,width=1200,height=886" },
  { name:"Flour (1kg)", price:45, img:"https://www.unlockfood.ca/EatRightOntario/media/Website-images-resized/All-about-grain-flours-resized.jpg" },
  { name:"Milk (1L)", price:75, img:"https://dairynutrition.ca/sites/dairynutrition/files/image_file_browser/dn_article/2023-03/shutterstock_4305538_1182x788px.jpg" },
  { name:"Sugar (1kg)", price:50, img:"https://vrmshoppe.com/wp-content/uploads/2021/05/white-sugar-500x500-1.jpg" },
  { name:"Refined Oil (1L)", price:200, img:"https://thumbs.dreamstime.com/b/sunflower-oil-factory-line-production-filling-refined-seeds-conveyor-food-industry-116766070.jpg" },
  { name:"Potato (1kg)", price:30, img:"https://www.kew.org/sites/default/files/styles/plant_image_953w/public/2025-01/many-potatoes-solanum-tuberosum.jpg.webp?itok=vTBE-XTL" },
  { name:"Tomato (1kg)", price:25, img:"https://www.lovefoodhatewaste.com/sites/default/files/styles/twitter_card_image/public/2022-08/Tomatoes-sh769524253.jpg.webp?itok=QYFYzSFr" }
  { name:"Rice (1kg)", price:70, img:"https://c.ndtvimg.com/2023-08/brlp7gk_uncooked-rice-or-rice-grains_625x300_18_August_23.jpg?im=FaceCrop,algorithm=dnn,width=1200,height=886" },
  { name:"Flour (1kg)", price:45, img:"https://www.unlockfood.ca/EatRightOntario/media/Website-images-resized/All-about-grain-flours-resized.jpg" },
  { name:"Milk (1L)", price:75, img:"https://dairynutrition.ca/sites/dairynutrition/files/image_file_browser/dn_article/2023-03/shutterstock_4305538_1182x788px.jpg" },
  { name:"Sugar (1kg)", price:50, img:"https://vrmshoppe.com/wp-content/uploads/2021/05/white-sugar-500x500-1.jpg" },
  { name:"Refined Oil (1L)", price:200, img:"https://thumbs.dreamstime.com/b/sunflower-oil-factory-line-production-filling-refined-seeds-conveyor-food-industry-116766070.jpg" },
  { name:"Potato (1kg)", price:30, img:"https://www.kew.org/sites/default/files/styles/plant_image_953w/public/2025-01/many-potatoes-solanum-tuberosum.jpg.webp?itok=vTBE-XTL" },
  { name:"Tomato (1kg)", price:25, img:"https://www.lovefoodhatewaste.com/sites/default/files/styles/twitter_card_image/public/2022-08/Tomatoes-sh769524253.jpg.webp?itok=QYFYzSFr" }
];

const container = document.getElementById("products");

// Render function (IMPORTANT for search)
function renderProducts(list){
  container.innerHTML = "";

  list.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <p class='price'>₹${p.price}</p>
      <div class='qty'>
        <button onclick='changeQty(${i},-1)'>-</button>
        <span id='qty${i}'>0</span>
        <button onclick='changeQty(${i},1)'>+</button>
      </div>
    `;
    container.appendChild(div);
  });
}

// Search function
window.searchProduct = function(text){
  let filtered = products.filter(p =>
    p.name.toLowerCase().includes(text.toLowerCase())
  );
  renderProducts(filtered);
}

// Initial render
renderProducts(products);

// बाकी functions same
window.changeQty = function(i,delta){
  let item = cart.find(x=>x.index===i);

  if(!item && delta>0){
    cart.push({index:i, qty:1});
  } 
  else if(item){
    item.qty += delta;
    if(item.qty<=0){
      cart = cart.filter(x=>x.index!==i);
    }
  }

  updateCart();
}

function updateCart(){
  let total=0;
  document.getElementById("cartItems").innerHTML="";

  products.forEach((_,i)=>{
    let el = document.getElementById("qty"+i);
    if(el) el.innerText=0;
  });

  cart.forEach(c=>{
    let p=products[c.index];
    total += p.price*c.qty;

    let el = document.getElementById("qty"+c.index);
    if(el) el.innerText=c.qty;

    let div=document.createElement("div");
    div.innerHTML=`${p.name} x${c.qty}`;
    document.getElementById("cartItems").appendChild(div);
  });

  let delivery = total>=500?0:20;

  document.getElementById("itemsTotal").innerText=total;
  document.getElementById("delivery").innerText=delivery;
  document.getElementById("grandTotal").innerText=total+delivery;
}

window.goToPayment = function(){
  let total = document.getElementById("grandTotal").innerText;
  if(total == 0) return alert("Cart empty hai");

  window.location.href = "payment.html?amount=" + total;
}

window.placeOrder = function(){
  if(cart.length===0) return alert("Cart empty hai");

  let address=document.getElementById("address").value;

  let items = cart.map(c=>{
    let p=products[c.index];
    return `${p.name} x${c.qty}`;
  }).join(", ");

  let total=document.getElementById("grandTotal").innerText;

  let msg=`🛒 New Order

Items: ${items}
Total: ₹${total}
Payment: UPI Done

Address: ${address}`;

  window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`);
}

};
</script>

</body>
</html>
