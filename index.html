<!DOCTYPE html>
<html>
<head>
  <title>Rewa Grocery Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #2ecc71; color: white; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; }
    .sub { text-align: center; margin: 10px; color: #555; }
    .search { text-align:center; margin: 10px; }
    input { padding:10px; width:80%; max-width:400px; border-radius:5px; border:1px solid #ccc; }
    .offers { background:#fff3cd; padding:10px; text-align:center; margin:10px; border-radius:5px; }
    .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    .card img { width:100%; height:120px; object-fit:cover; border-radius:8px; }
    .price { color: #2ecc71; font-size: 18px; font-weight: bold; }
    button { margin-top: 10px; padding: 10px; width: 100%; background: #25D366; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .cart { position:fixed; top:10px; right:10px; background:#fff; padding:10px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
<header>🛒 Rewa Grocery Store</header>
<p class="sub">Free Home Delivery in Rewa 🚚 | Fresh Products</p>

<div class="offers">🔥 Offer: ₹500+ order = FREE Delivery | ₹1000+ = ₹50 OFF</div>

<div class="search">
  <input type="text" id="search" placeholder="Search product..." onkeyup="filterProducts()">
</div>

<div class="cart">🛒 Cart: <span id="cartCount">0</span></div>

<div class="container" id="products"></div>

<script>
const whatsappNumber = "918109788338";
let cart = 0;

const products = [
  { name: "Rice (1kg)", price: 70, img: "https://via.placeholder.com/150" },
  { name: "Wheat Flour (1kg)", price: 45, img: "https://via.placeholder.com/150" },
  { name: "Milk (1L)", price: 75, img: "https://via.placeholder.com/150" },
  { name: "Sugar (1kg)", price: 50, img: "https://via.placeholder.com/150" },
  { name: "Oil (1L)", price: 200, img: "https://via.placeholder.com/150" },
  { name: "Potato (1Kg)", price: 30, img: "https://via.placeholder.com/150" },
  { name: "Tomato (1Kg)", price: 25, img: "https://via.placeholder.com/150" }
];

const container = document.getElementById("products");

function displayProducts(list) {
  container.innerHTML = "";
  list.forEach(p => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <img src="${p.img}" />
      <h3>${p.name}</h3>
      <p class="price">₹${p.price}</p>
      <button onclick="addToCart('${p.name}', ${p.price})">Add to Cart</button>
      <button onclick="order('${p.name}', ${p.price})">Order Now</button>
    `;
    container.appendChild(div);
  });
}

function addToCart(name, price) {
  cart++;
  document.getElementById("cartCount").innerText = cart;
}

function order(name, price) {
  const msg = `Namaste, mujhe ${name} (₹${price}) order karna hai.`;
  window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`);
}

function filterProducts() {
  const value = document.getElementById("search").value.toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(value));
  displayProducts(filtered);
}

// initial load
displayProducts(products);
</script>

</body>
</html>
