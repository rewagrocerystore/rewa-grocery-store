<!DOCTYPE html>
<html>
<head>
  <title>Rewa Grocery Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; margin:0; background:#f5f5f5; }
    header { background:#2ecc71; color:white; padding:15px; text-align:center; font-size:24px; }

    .container {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:15px;
      padding:20px;
    }

    .card {
      background:white;
      padding:15px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .price { color:#2ecc71; font-weight:bold; }

    button {
      padding:8px;
      margin:5px;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }

    .add { background:#25D366; color:white; }
    .pay { background:#6c5ce7; color:white; }
    .done { background:#0984e3; color:white; }

    .qty {
      display:flex;
      justify-content:center;
      gap:5px;
    }

    .cart-box {
      position: fixed;
      right: 10px;
      bottom: 10px;
      width: 280px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    input, select {
      width:100%;
      padding:8px;
      margin-top:5px;
    }

    .qr {
      width:150px;
      display:block;
      margin:auto;
    }
  </style>
</head>

<body>

<header>🛒 Rewa Grocery Store</header>

<div class="container" id="products"></div>

<div class="cart-box">
  <h3>🛒 Cart</h3>
  <div id="cartItems"></div>

  <p>Items: ₹<span id="itemsTotal">0</span></p>
  <p>Delivery: ₹<span id="delivery">20</span></p>
  <p><b>Total: ₹<span id="grandTotal">0</span></b></p>

  <input type="text" id="address" placeholder="Enter address">

  <select id="payment">
    <option value="COD">Cash on Delivery</option>
    <option value="UPI">UPI Payment</option>
  </select>

  <!-- QR CODE -->
  <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=8109788338@ybl" />

  <button class="pay" onclick="payUPI()">Pay via UPI</button>
  <button class="done" onclick="paymentDone()">Payment Done</button>
  <button class="add" onclick="placeOrder()">Place Order</button>
</div>

<script>
window.onload = function() {

const whatsappNumber = "918109788338";
const upiId = "8109788338@ybl";

let cart = [];

const products = [
  { name:"Rice (1kg)", price:70 },
  { name:"Flour (1kg)", price:45 },
  { name:"Milk (1L)", price:75 },
  { name:"Sugar (1kg)", price:50 }
];

const container = document.getElementById("products");

products.forEach((p,i)=>{
  const div=document.createElement("div");
  div.className="card";
  div.innerHTML=`
    <h3>${p.name}</h3>
    <p class='price'>₹${p.price}</p>
    <div class='qty'>
      <button onclick='changeQty(${i},-1)'>-</button>
      <span id='qty${i}'>0</span>
      <button onclick='changeQty(${i},1)'>+</button>
    </div>
  `;
  container.appendChild(div);
});

window.changeQty = function(i,delta){
  let item = cart.find(x=>x.index===i);

  if(!item && delta>0){
    cart.push({index:i, qty:1});
  } else if(item){
    item.qty += delta;
    if(item.qty<=0){
      cart = cart.filter(x=>x.index!==i);
    }
  }
  updateCart();
}

function updateCart(){
  let total=0;
  document.getElementById("cartItems").innerHTML="";

  products.forEach((_,i)=>{
    document.getElementById("qty"+i).innerText=0;
  });

  cart.forEach(c=>{
    let p=products[c.index];
    total += p.price*c.qty;

    document.getElementById("qty"+c.index).innerText=c.qty;

    let div=document.createElement("div");
    div.innerHTML=`${p.name} x${c.qty}`;
    document.getElementById("cartItems").appendChild(div);
  });

  let delivery = total>=500?0:20;

  document.getElementById("itemsTotal").innerText=total;
  document.getElementById("delivery").innerText=delivery;
  document.getElementById("grandTotal").innerText=total+delivery;
}

window.payUPI = function(){
  let total=document.getElementById("grandTotal").innerText;
  if(total==0) return alert("Cart empty hai");

  window.open(`upi://pay?pa=${upiId}&pn=RewaStore&am=${total}&cu=INR`);
}

window.paymentDone = function(){
  alert("Payment received! Now place order.");
}

window.placeOrder = function(){
  if(cart.length===0) return alert("Cart empty hai");

  let address=document.getElementById("address").value;
  let payment=document.getElementById("payment").value;

  let items = cart.map(c=>{
    let p=products[c.index];
    return `${p.name} x${c.qty}`;
  }).join(", ");

  let total=document.getElementById("grandTotal").innerText;

  let msg=`Order: ${items}\nTotal: ₹${total}\nPayment: ${payment}\nAddress: ${address}`;

  window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`);

  alert("Order sent on WhatsApp!");
}

};
</script>

</body>
</html>
