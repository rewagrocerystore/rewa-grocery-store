<!DOCTYPE html>
<html>
<head>
  <title>Rewa Grocery Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #2ecc71;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .sub {
      text-align: center;
      margin: 10px;
      color: #555;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h3 {
      margin: 10px 0;
    }

    .price {
      color: #2ecc71;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1ebe5d;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #ddd;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>🛒 Rewa Grocery Store</header>
<p class="sub">Free Home Delivery in Rewa 🚚 | Fresh Products | Best Prices</p>

<div class="container" id="products"></div>

<footer>
  📞 Order on WhatsApp | Same Day Delivery Available
</footer>

<script>
const whatsappNumber = "918109788338";

const products = [
  { name: "Rice (1kg)", price: 70 },
  { name: "Wheat Flour (1kg)", price: 45 },
  { name: "Milk (1L)", price: 75 },
  { name: "Sugar (1kg)", price: 50 },
  { name: "Cooking Refined Oil (1L)", price: 200 },
  { name: "Potato (1Kg)", price: 30 },
  { name: "Tomato (1Kg)", price: 25 }
];

const container = document.getElementById("products");

products.forEach(p => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <h3>${p.name}</h3>
    <p class="price">₹${p.price}</p>
    <button onclick="order('${p.name}', ${p.price})">Order on WhatsApp</button>
  `;
  container.appendChild(div);
});

function order(name, price) {
  const msg = `Namaste, mujhe ${name} (₹${price}) order karna hai.`;
  window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`);
}
</script>

</body>
</html>
