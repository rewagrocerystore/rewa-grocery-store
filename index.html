<!DOCTYPE html>
<html>
<head>
  <title>Rewa Grocery Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; margin:0; background:#f2f3f7; }

    header {
      background: linear-gradient(135deg,#2ecc71,#27ae60);
      color:white;
      padding:20px;
      text-align:center;
      position:sticky;
      top:0;
      z-index:10;
    }

    .title { font-size:24px; font-weight:bold; }
    .tagline { font-size:14px; margin-top:8px; }

    .search-box {
      margin-top:10px;
      padding:10px;
      width:90%;
      max-width:300px;
      border:none;
      border-radius:25px;
    }

    .trust {
      text-align:center;
      padding:10px;
      font-weight:bold;
      color:#444;
    }

    .container {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:15px;
      padding:15px;
    }

    .card {
      background:white;
      padding:10px;
      border-radius:15px;
      text-align:center;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    .card img { width:100%; height:120px; object-fit:cover; border-radius:10px; }

    .price { color:#27ae60; font-weight:bold; font-size:18px; }

    .qty { display:flex; justify-content:center; gap:10px; }

    button { padding:6px 10px; border:none; border-radius:8px; cursor:pointer; }
    .add { background:#2ecc71; color:white; }

    /* Cart */
    .cart-box {
      position: fixed;
      right:0;
      top:0;
      width:320px;
      height:100%;
      background:white;
      transform:translateX(100%);
      transition:0.3s;
      padding:10px;
      z-index:20;
      display:flex;
      flex-direction:column;
    }
    .cart-box.open { transform:translateX(0); }

    .cart-items { flex:1; overflow:auto; }

    input { width:100%; padding:8px; margin-top:5px; border-radius:5px; }

    #floatingCart {
      position:fixed;
      bottom:20px;
      right:20px;
      background:#2ecc71;
      color:white;
      width:60px;
      height:60px;
      border-radius:50%;
      font-size:24px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .reviews { padding:20px; }
    .review { background:white; padding:10px; margin:10px 0; border-radius:10px; }

  </style>
</head>

<body>

<header>
  <div class="title">🛒 Rewa Grocery</div>
  <div class="tagline">
    📍 Only in Rewa City <br>
    🚚 Delivery in 2–3 hours <br>
    🎉 Free delivery above ₹500
  </div>

  <input type="text" class="search-box" placeholder="Search..." onkeyup="searchProduct(this.value)">
</header>

<div class="trust">⭐ 100+ Happy Customers | 📞 8109788338</div>

<div class="container" id="products"></div>

<!-- Reviews -->
<div class="reviews">
  <h2>💬 Customer Reviews</h2>
  <div class="review">⭐⭐⭐⭐⭐ Fast delivery – Rahul</div>
  <div class="review">⭐⭐⭐⭐⭐ Best service – Pooja</div>
</div>

<!-- Cart -->
<div class="cart-box" id="cartBox">
  <h3>🛒 Cart</h3>
  <div class="cart-items" id="cartItems"></div>

  <p>Total: ₹<span id="total">0</span></p>

  <input id="name" placeholder="Name">
  <input id="mobile" placeholder="Mobile">
  <input id="address" placeholder="Address">

  <button onclick="placeOrder()">Order on WhatsApp</button>
</div>

<div id="floatingCart" onclick="toggleCart()">🛒</div>

<script>
const whatsappNumber = "918109788338";

const products = [
  { name:"Rice (1kg)", price:70, img:"https://c.ndtvimg.com/2023-08/brlp7gk_uncooked-rice-or-rice-grains_625x300_18_August_23.jpg" },
    { name:"Flour (1kg)", price:45, img:"https://www.unlockfood.ca/EatRightOntario/media/Website-images-resized/All-about-grain-flours-resized.jpg" },
    { name:"Milk (1L)", price:75, img:"https://dairynutrition.ca/sites/dairynutrition/files/image_file_browser/dn_article/2023-03/shutterstock_4305538_1182x788px.jpg" },
    { name:"Sugar (1kg)", price:50, img:"https://vrmshoppe.com/wp-content/uploads/2021/05/white-sugar-500x500-1.jpg" },
    { name:"Refined Oil (1L)", price:200, img:"https://thumbs.dreamstime.com/b/sunflower-oil-factory-line-production-filling-refined-seeds-conveyor-food-industry-116766070.jpg" },
    { name:"Potato (1kg)", price:30, img:"https://www.kew.org/sites/default/files/styles/plant_image_953w/public/2025-01/many-potatoes-solanum-tuberosum.jpg.webp?itok=vTBE-XTL" },
    { name:"Tomato (1kg)", price:25, img:"https://www.lovefoodhatewaste.com/sites/default/files/styles/twitter_card_image/public/2022-08/Tomatoes-sh769524253.jpg.webp?itok=QYFYzSFr" },
    { name:"Onion (1kg)", price:25, img:"https://cdn.pixabay.com/photo/2016/06/02/01/35/vegetables-1430062_640.jpg" },
    { name:"Bottle Gourd (1kg)", price:45, img:"https://www.bbassets.com/media/uploads/p/l/50000468_8-fresho-bottle-gourd-organically-grown.jpg" },
    { name:"Brinjal (1kg)", price:35, img:"https://www.chefadora.com/_next/image?url=https%3A%2F%2Fchefadora-production.s3.ap-southeast-2.amazonaws.com%2Fmedium_ingredient_brinjal_1ed0af6b11.png&w=3840&q=75" },
    { name:"Banana (1kg)", price:70, img:"https://m.media-amazon.com/images/I/51ebZJ+DR4L._AC_UF894,1000_QL80_.jpg" },
    { name:"Apple (1kg)", price:250, img:"https://assets.clevelandclinic.org/transform/cd71f4bd-81d4-45d8-a450-74df78e4477a/Apples-184940975-770x533-1_jpg" }
];

let cart=[];

function renderProducts(list){
  let html="";
  list.forEach((p,i)=>{
    html+=`
      <div class="card">
        <img src="${p.img}">
        <h4>${p.name}</h4>
        <div class="price">₹${p.price}</div>
        <div class="qty">
          <button onclick="changeQty(${i},-1)">-</button>
          <span id="q${i}">0</span>
          <button onclick="changeQty(${i},1)">+</button>
        </div>
      </div>
    `;
  });
  document.getElementById("products").innerHTML=html;
}

function changeQty(i,d){
  let item=cart.find(x=>x.i===i);
  if(!item && d>0) cart.push({i,qty:1});
  else if(item){
    item.qty+=d;
    if(item.qty<=0) cart=cart.filter(x=>x.i!==i);
  }
  updateCart();
}

function updateCart(){
  let total=0;
  let html="";
  products.forEach((_,i)=>document.getElementById("q"+i).innerText=0);

  cart.forEach(c=>{
    let p=products[c.i];
    total+=p.price*c.qty;
    document.getElementById("q"+c.i).innerText=c.qty;
    html+=`${p.name} x${c.qty}<br>`;
  });

  document.getElementById("cartItems").innerHTML=html;
  document.getElementById("total").innerText=total;
}

function toggleCart(){
  document.getElementById("cartBox").classList.toggle("open");
}

function searchProduct(t){
  renderProducts(products.filter(p=>p.name.toLowerCase().includes(t.toLowerCase())));
}

function placeOrder(){
  if(cart.length===0) return alert("Cart empty");

  let name=document.getElementById("name").value;
  let mobile=document.getElementById("mobile").value;
  let address=document.getElementById("address").value;

  let items=cart.map(c=>products[c.i].name+" x"+c.qty).join(", ");
  let total=document.getElementById("total").innerText;

  let msg=`🛒 Order\nName:${name}\nMobile:${mobile}\nItems:${items}\nTotal:₹${total}\nAddress:${address}`;

  window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`);
}

renderProducts(products);
</script>

</body>
</html>
