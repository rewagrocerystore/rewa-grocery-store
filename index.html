<!DOCTYPE html>
<html>
<head>
  <title>Rewa Grocery Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; margin:0; background:#f5f5f5; }
    header { background:#2ecc71; color:white; padding:15px; text-align:center; font-size:24px; }
    .container { padding:15px; }
    .card { background:white; padding:10px; margin:10px 0; border-radius:8px; }
    input, button { padding:10px; margin:5px; width:90%; }
    button { background:#25D366; color:white; border:none; }
    .checkout { background:#fff; padding:15px; margin-top:20px; border-radius:10px; }
  </style>
</head>
<body>

<header>🛒 Rewa Grocery Store</header>

<div class="container" id="products"></div>

<div class="checkout">
  <h3>🧾 Checkout</h3>
  <p>Total: ₹<span id="total">0</span></p>
  <input type="text" id="address" placeholder="Enter your address">
  <button onclick="placeOrder()">Order on WhatsApp</button>
  <button onclick="payUPI()">Pay via UPI</button>
</div>

<script>
const whatsappNumber = "918109788338";
let cart = [];

const products = [
  { name: "Rice (1kg)", price: 70, img: "https://via.placeholder.com/150" },
  { name: "Wheat Flour (1kg)", price: 45, img: "https://via.placeholder.com/150" },
  { name: "Milk (1L)", price: 75, img: "https://via.placeholder.com/150" },
  { name: "Sugar (1kg)", price: 50, img: "https://via.placeholder.com/150" },
  { name: "Oil (1L)", price: 200, img: "https://via.placeholder.com/150" },
  { name: "Potato (1Kg)", price: 30, img: "https://via.placeholder.com/150" },
  { name: "Tomato (1Kg)", price: 25, img: "https://www.lovefoodhatewaste.com/sites/default/files/styles/twitter_card_image/public/2022-08/Tomatoes-sh769524253.jpg.webp?itok=QYFYzSFr" }
];

const container = document.getElementById("products");

products.forEach(p => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <h3>${p.name}</h3>
    <p>₹${p.price}</p>
    <button onclick="addToCart('${p.name}', ${p.price})">Add to Cart</button>
  `;
  container.appendChild(div);
});

function addToCart(name, price) {
  cart.push({name, price});
  updateTotal();
}

function updateTotal() {
  let total = cart.reduce((sum, item) => sum + item.price, 0);
  document.getElementById("total").innerText = total;
}

function placeOrder() {
  const address = document.getElementById("address").value;
  let items = cart.map(i => i.name).join(", ");
  let total = document.getElementById("total").innerText;
  const msg = `Order: ${items}\nTotal: ₹${total}\nAddress: ${address}`;
  window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`);
}

function payUPI() {
  window.open("upi://pay?pa=8109788338@ybl&pn=RewaStore&cu=INR");
}
</script>

</body>
</html>
