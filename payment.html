<!DOCTYPE html>
<html>
<head>
  <title>UPI Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; text-align:center; background:#f5f5f5; }
    h1 { margin-top:20px; }
    img { margin-top:20px; }
    .timer { font-size:20px; color:red; margin-top:10px; }
    button { padding:10px; margin-top:15px; background:#6c5ce7; color:white; border:none; border-radius:5px; }
  </style>
</head>

<body>

<h1>Scan & Pay</h1>

<p>Amount: ₹<span id="amount"></span></p>

<img id="qr" width="200">

<p class="timer">Time left: <span id="time">120</span> sec</p>

<button onclick="openUPI()">Open UPI App</button>

<script>
const upiId = "8109788338@ybl";

const params = new URLSearchParams(window.location.search);
const amount = params.get("amount");

document.getElementById("amount").innerText = amount;

document.getElementById("qr").src =
  "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
  encodeURIComponent(`upi://pay?pa=${upiId}&pn=RewaStore&am=${amount}&cu=INR`);

let time = 120;
setInterval(()=>{
  time--;
  document.getElementById("time").innerText = time;

  if(time <= 0){
    alert("Session expired!");
    window.history.back();
  }
},1000);

function openUPI(){
  window.location.href = `upi://pay?pa=${upiId}&pn=RewaStore&am=${amount}&cu=INR`;
}
</script>

</body>
</html>
